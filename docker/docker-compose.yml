services:
  review-assistant-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: secure-code-review-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ..:/app
    networks:
      - secure-review-net

  review-assistant-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: secure-code-review-ui
    ports:
      - "8501:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      REVIEW_API_URL: "http://review-assistant-api:8000/api/v1/review"
    command: ["streamlit", "run", "src/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    depends_on:
      - review-assistant-api
    volumes:
      - ..:/app
    networks:
      - secure-review-net

networks:
  secure-review-net:
    driver: bridge
