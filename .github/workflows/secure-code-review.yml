name: Secure code review

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  repository-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic review dependencies
        run: pip install -r requirements.txt
      - name: Run component and adversarial regression tests
        run: python -m pytest -q
      - name: Review repository and emit SARIF
        run: python tools/ci_review.py demo/repository/clean_speed_monitor --format sarif --output automotive-review.sarif --fail-on High
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: automotive-review.sarif
