name: Secure code review

on:
  pull_request:
  workflow_dispatch:

jobs:
  repository-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic review dependencies
        run: pip install -r requirements.txt
      - name: Review repository and emit SARIF
        continue-on-error: true
        run: python tools/ci_review.py . --format sarif --output automotive-review.sarif --fail-on High
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: automotive-review.sarif
